name: 功能建议
description: 提交新的产品需求
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先描述实际使用场景，不要只写功能名称
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望怎样解决
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他可接受方案
