name: Bug 报告
description: 报告可稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除 API Key、真实简历、手机号、邮箱和私人聊天信息。
  - type: input
    id: version
    attributes:
      label: JobClaw 版本
      placeholder: 例如 1.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome 与操作系统
      placeholder: 例如 Chrome 150 / macOS 15
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 出问题的阶段
      options:
        - 安装扩展
        - AI 配置
        - 简历解析
        - 职业画像
        - 岗位方向
        - 岗位搜索
        - AI 分析
        - 人工确认
        - 自动投递
        - OpenClaw
        - 其他
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按 1、2、3 写清楚
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除 API Key、真实简历和个人身份信息
          required: true
