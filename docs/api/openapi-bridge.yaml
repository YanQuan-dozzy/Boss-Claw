openapi: 3.0.3

# ============================================================================
# BossClaw OpenClaw 本地桥接服务（Local Bridge）OpenAPI v3 规范
# ----------------------------------------------------------------------------
# 代码来源：desktop-app/bridge/server.cjs（Node http 标准库实现）+ config.json
# 启动方式：主进程经 jc:bridge-control(start) 按需以 ELECTRON_RUN_AS_NODE=1
#           spawn electron 二进制运行 server.cjs；也可手动 node server.cjs。
# 用途：状态/日报/控制（start/pause/stop/restore）、简历解析降级通道
#       （PDF pdftotext、DOCX mammoth、TXT/MD 直读）。数据持久化于
#       ~/.bossclaw/data.json（events/commands/snapshots/control）。
#
# 鉴权：请求携带 ?token=bossclaw-desktop-bridge（apiKey，in:query），
#       校验失败返回 HTTP 403 {ok:false,error:"token denied"}。
# 注意：服务端对同一 path 不区分 GET/POST（按 pathname 分发），下表登记
#       渲染层真实使用的方法；OPTIONS 预检恒 200。
# ============================================================================

info:
  title: BossClaw OpenClaw 本地桥接服务
  description: |
    随 BossClaw 桌面版按需启动的本地桥接服务（Node 跨平台版，移植自
    job-claw-main desktop-bridge）。提供四类能力：
      1) 状态与日志：/status、/logs、/report；
      2) 引擎控制：/command（start / pause / stop / restore）；
      3) 简历解析（渲染层降级通道）：/ocr（PDF）、/resume-text（PDF/DOCX/TXT/MD）；
    数据保存在 ~/.bossclaw/data.json（events 事件、commands 指令、
    snapshots 快照、control 运行状态），日志以「今日」维度聚合生成日报。
    仅监听 127.0.0.1 回环地址。
  version: 2.0.0
  x-code-path: desktop-app/bridge/server.cjs
  x-config-path: desktop-app/bridge/config.json
  x-port: 18765
  x-token: bossclaw-desktop-bridge
  x-database-path: ~/.bossclaw/data.json

servers:
  - url: http://127.0.0.1:18765
    description: 本机 OpenClaw 桥（仅回环；由主进程 jc:bridge-control 按需拉起，或手动 node server.cjs）

tags:
  - name: 状态与日志
    description: 桥状态探测、日志与日报查询
  - name: 引擎控制
    description: 投递引擎运行控制（start/pause/stop/restore）
  - name: 简历解析
    description: 简历文件解析降级通道（PDF/DOCX/TXT/MD → 纯文本）

paths:
  /status:
    get:
      operationId: bridgeStatus
      tags: [状态与日志]
      summary: 查询桥接服务状态
      description: |
        返回桥自身状态：名称/版本/运行与暂停标记、pdftotext 是否可用、
        数据文件路径与事件条数。渲染层 Settings/OpenClaw 页据此判断
        「已连接」。
      security:
        - tokenQuery: []
      responses:
        '200':
          description: 桥状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResult' }
              example:
                ok: true
                name: bossclaw-bridge
                version: 2.0.0
                running: true
                paused: false
                parsers:
                  pdftotext: true
                databasePath: C:/Users/DELL/.bossclaw/data.json
                events: 128
        '403':
          $ref: '#/components/responses/TokenDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /logs:
    get:
      operationId: bridgeLogs
      tags: [状态与日志]
      summary: 查询最近指令与事件日志
      description: 时间倒序返回最近各最多 50 条指令（commands）与事件（events）。
      security:
        - tokenQuery: []
      responses:
        '200':
          description: 日志列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogsResult' }
              example:
                ok: true
                commands:
                  - type: start
                    ts: 1788249600000
                events:
                  - message: 投递成功
                    ts: 1788249610000
                    data:
                      job:
                        title: 前端开发工程师
                        company: 北京某某科技有限公司
        '403':
          $ref: '#/components/responses/TokenDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /report:
    get:
      operationId: bridgeReport
      tags: [状态与日志]
      summary: 生成本日求职日报文本
      description: |
        聚合「今日」事件生成纯文本日报（成功沟通/失败/岗位分析条数 +
        最近成功岗位清单），供 OpenClaw 页 / 外部工具取用。
      security:
        - tokenQuery: []
      responses:
        '200':
          description: 日报纯文本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResult' }
              example:
                ok: true
                report: |
                  BossClaw 求职日报｜2026/9/6

                  成功沟通：3
                  沟通失败：1
                  岗位分析：2
                  运行事件：6

                  - 前端开发工程师 · 北京某某科技有限公司
                  - Java 开发工程师 · 上海某某信息科技有限公司

                  ByChris
        '403':
          $ref: '#/components/responses/TokenDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /command:
    post:
      operationId: bridgeCommand
      tags: [引擎控制]
      summary: 控制投递引擎运行状态
      description: |
        写入一条控制指令并持久化：start 置 running=true；pause 置 paused=true；
        stop 置 running=false；restore 返回最近一次快照（不改变状态）。
        响应携带更新后的 control 或命中的 snapshot。
      security:
        - tokenQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
            example:
              type: start
      responses:
        '200':
          description: 控制结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
              examples:
                start/pause/stop:
                  value:
                    ok: true
                    control:
                      running: true
                      paused: false
                restore（返回最近快照）:
                  value:
                    ok: true
                    snapshot:
                      ts: 1788249600000
                      jobs:
                        - jobId: 5f2e7d9c1a3b4c5d6e7f8a9b
                          title: 前端开发工程师
                          status: opened
                  # snapshot 结构为快照对象或 null，见 schema
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/TokenDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /ocr:
    post:
      operationId: parseResumePdf
      tags: [简历解析]
      summary: 解析 PDF 简历（本机 pdftotext / 文本校验）
      description: |
        接收 PDF 的 base64 data URL，写入临时文件后调用本机 pdftotext
        （poppler）提取文本；缺少 pdftotext 或正文不可读（中英文/控制字符
        占比与关键词启发式校验）时返回 ok=false。文件上限 18MB。
        附带 diagnostics 记录各解析器尝试结果。
      security:
        - tokenQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PdfParseRequest' }
            example:
              dataUrl: data:application/pdf;base64,JVBERi0xLjQKJ…（示例省略）
      responses:
        '200':
          description: 解析结果（HTTP 200；成败看 ok/text）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeParseResult' }
              examples:
                成功:
                  value:
                    ok: true
                    text: 张三\n电话：13800138000\n邮箱：zhangsan@example.com\n教育经历…\n（示例截断）
                    method: pdftotext
                    diagnostics:
                      - method: pdftotext
                        ok: true
                        detail: 1280 字
                不可读/无解析器:
                  value:
                    ok: false
                    text: ''
                    method: none
                    error: 本机解析与 OCR 均未识别到可靠正文（可安装 poppler 的 pdftotext 或改用 DOCX/TXT）
                    diagnostics:
                      - method: pdftotext
                        ok: false
                        detail: 未安装
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/TokenDenied'
        '413':
          $ref: '#/components/responses/TooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /resume-text:
    post:
      operationId: parseResumeText
      tags: [简历解析]
      summary: 解析简历为纯文本（按扩展名自动分流）
      description: |
        渲染层简历解析的统一桥接降级通道，按 name 扩展名分流：
          .txt / .md  → UTF-8 直读；
          .docx       → mammoth extractRawText；
          其它（含 .pdf）→ 走 /ocr 同款 pdftotext 逻辑。
        dataUrl 为 base64 data URL；超限（>18MB PDF）报错。
      security:
        - tokenQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeTextRequest' }
            example:
              dataUrl: data:application/pdf;base64,JVBERi0xLjQKJ…（示例省略）
              name: 张三-简历.pdf
      responses:
        '200':
          description: 解析结果（HTTP 200；成败看 ok/text）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeParseResult' }
              examples:
                DOCX 成功:
                  value:
                    ok: true
                    text: 张三\n电话：13800138000\n邮箱：zhangsan@example.com\n（示例截断）
                    method: mammoth
                TXT 成功:
                  value:
                    ok: true
                    text: 张三\n电话：13800138000\n（示例截断）
                    method: text
                PDF 成功:
                  value:
                    ok: true
                    text: 张三\n教育经历…（示例截断）
                    method: pdftotext
                    diagnostics:
                      - method: pdftotext
                        ok: true
                        detail: 1280 字
                DOCX 解析失败:
                  value:
                    ok: false
                    text: ''
                    method: none
                    error: DOCX 解析失败（需安装 mammoth 或改用 PDF/TXT）：…
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/TokenDenied'
        '413':
          $ref: '#/components/responses/TooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: 静态令牌（默认 bossclaw-desktop-bridge）。仅限本机回环；缺失/错误返回 HTTP 403。

  responses:
    TokenDenied:
      description: 令牌缺失或不匹配
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { ok: false, error: token denied }
    BadRequest:
      description: 请求体 JSON 解析失败或字段非法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { ok: false, error: request body invalid }
    TooLarge:
      description: 请求体超过 28MB 上限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { ok: false, error: request too large }
    NotFound:
      description: 路径不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { ok: false, error: not found }
    ServerError:
      description: 处理中抛出的未捕获异常（解析失败等业务错误也会以 HTTP 200 包 {ok:false} 返回，见各端点说明）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
          example: { ok: false, error: 'Error: …' }

  schemas:
    ErrorBody:
      type: object
      description: 通用错误体（鉴权 / 路由 / 大小限制）
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string

    StatusResult:
      type: object
      properties:
        ok:
          type: boolean
          description: 恒 true（已鉴权）
        name:
          type: string
          enum: [bossclaw-bridge]
        version:
          type: string
          description: 桥版本（当前 2.0.0）
        running:
          type: boolean
          description: 引擎运行标记（control.running）
        paused:
          type: boolean
          description: 引擎暂停标记（control.paused）
        parsers:
          type: object
          description: 解析器可用性
          properties:
            pdftotext:
              type: boolean
              description: 本机是否安装 poppler pdftotext
        databasePath:
          type: string
          description: 数据文件绝对路径
        events:
          type: integer
          description: 累计事件条数

    LogsResult:
      type: object
      properties:
        ok:
          type: boolean
        commands:
          type: array
          description: 最近指令（最多 50 条，倒序）
          items:
            type: object
            properties:
              type:
                type: string
                enum: [start, pause, stop, restore]
              ts:
                type: integer
                format: int64
                description: 毫秒时间戳
        events:
          type: array
          description: 最近事件（最多 50 条，倒序）
          items:
            type: object
            properties:
              message:
                type: string
                description: 事件文本，如 投递成功 / 投递失败 / 岗位分析完成…
              ts:
                type: integer
                format: int64
              data:
                type: object
                description: 事件附加数据（job 等）
                properties:
                  job:
                    type: object
                    properties:
                      title: { type: string }
                      company: { type: string }

    ReportResult:
      type: object
      properties:
        ok:
          type: boolean
        report:
          type: string
          description: 今日日报纯文本（UTF-8）

    CommandRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [start, pause, stop, restore]
          description: |
            start=置运行中；pause=置暂停；stop=停止（运行/暂停均 false）；
            restore=返回最近快照（不改变状态）
      example:
        type: pause

    CommandResult:
      type: object
      oneOf:
        - description: start/pause/stop 的响应
          properties:
            ok:
              type: boolean
            control:
              type: object
              description: 更新后的控制状态
              properties:
                running: { type: boolean }
                paused: { type: boolean }
        - description: restore 的响应
          properties:
            ok:
              type: boolean
            snapshot:
              type: object
              nullable: true
              description: 最近一次快照（无快照时为 null）
              properties:
                ts:
                  type: integer
                  format: int64
                  description: 快照时间（毫秒）
                jobs:
                  type: array
                  description: 快照中的岗位/投递状态列表（结构由写入方决定）
                  items:
                    type: object

    PdfParseRequest:
      type: object
      description: /ocr 请求（PDF 简历）
      required: [dataUrl]
      properties:
        dataUrl:
          type: string
          description: PDF 的 base64 data URL（data:application/pdf;base64,…；≤18MB）
          example: data:application/pdf;base64,JVBERi0xLjQK…

    ResumeTextRequest:
      type: object
      description: /resume-text 请求
      required: [dataUrl, name]
      properties:
        dataUrl:
          type: string
          description: 文件内容 base64 data URL（≤18MB）
        name:
          type: string
          description: 原始文件名（.txt/.md/.docx/其它；决定解析方法）
          example: 张三-简历.docx

    ResumeParseResult:
      type: object
      properties:
        ok:
          type: boolean
          description: 是否提取到可靠正文（启发式：可读字符占比 ≥0.5 且含简历关键词或 ≥220 字）
        text:
          type: string
          description: 解析出的纯文本（失败为空串）
        method:
          type: string
          enum: [pdftotext, mammoth, text, none]
          description: 实际成功的解析器（失败为 none）
        error:
          type: string
          description: 失败原因（仅失败时出现）
        diagnostics:
          type: array
          description: 各解析器尝试记录（pdf 路径返回）
          items:
            type: object
            properties:
              method:
                type: string
                enum: [pdftotext]
              ok:
                type: boolean
              detail:
                type: string
                description: 简要结果（字数 / 错误 / 未安装）
