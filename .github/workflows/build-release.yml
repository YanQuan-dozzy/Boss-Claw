name: Build & Release

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - "v*"                  # 打 v 标签时自动构建

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --win nsis portable
            artifact: win
          - platform: macos
            os: macos-latest
            args: --mac dmg zip
            artifact: mac
          - platform: linux
            os: ubuntu-latest
            args: --linux AppImage deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # 无签名证书，跳过代码签名
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Build renderer & typecheck
        working-directory: desktop-app
        run: npm run build

      - name: Package (${{ matrix.platform }})
        working-directory: desktop-app
        run: npx electron-builder ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BossClaw-${{ matrix.artifact }}
          path: |
            desktop-app/release/*.exe
            desktop-app/release/*.blockmap
            desktop-app/release/*.dmg
            desktop-app/release/*.zip
            desktop-app/release/*.AppImage
            desktop-app/release/*.deb
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BossClaw ${{ github.ref_name }}
          body: |
            BossClaw ${{ github.ref_name }} —— 跨平台安装包（Windows / macOS / Linux）

            > 由 GitHub Actions 自动构建。草稿发布，核对后手动发布。
          draft: true
          files: dist-artifacts/**/*
