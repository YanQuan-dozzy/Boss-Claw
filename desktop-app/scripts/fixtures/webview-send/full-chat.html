<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>BossClaw full chat page send regression fixture</title>
<style>
  body { font: 16px sans-serif; margin: 0; display: flex; height: 900px; }
  .chat-user-list { width: 260px; border-right: 1px solid #ccc; padding: 8px; overflow: auto; }
  .chat-user-search { box-sizing: border-box; width: 100%; padding: 6px; margin-bottom: 8px; }
  .chat-user-item { padding: 8px; min-height: 40px; border-bottom: 1px solid #eee; }
  .chat-user-preview { display: block; color: #666; font-size: 12px; }
  .chat-content { flex: 1; display: flex; flex-direction: column; padding: 12px; }
  .chat-header { min-height: 36px; }
  .chat-message { flex: 1; min-height: 200px; }
  .im-list { margin: 0; padding: 8px; min-height: 120px; }
  .message-item { list-style: none; min-height: 24px; }
  .chat-editor { padding: 8px; }
  .chat-input { min-height: 60px; border: 1px solid #aaa; padding: 8px; }
  .send-message { display: inline-block; padding: 8px; margin: 8px; }
  [hidden] { display: none !important; }
</style>
<div class="chat-user-list" id="conversation-list">
  <input class="chat-user-search" id="conversation-search" type="text" placeholder="搜索" aria-label="搜索会话" />
  <div class="chat-user-item" data-conversation-id="c1">
    <span class="chat-user-name">测试 HR 甲</span>
    <span class="chat-user-preview" id="list-preview">历史消息，用于确定新增消息的起点。</span>
  </div>
  <div class="chat-user-item" data-conversation-id="c2">
    <span class="chat-user-name">测试 HR 乙</span>
  </div>
</div>
<div class="chat-content" id="current-panel">
  <div class="chat-header">
    <span class="name">测试 HR 甲</span>
    <span class="company-name">离线测试公司</span>
    <span class="position-name">测试开发岗位</span>
  </div>
  <div class="chat-message">
    <ul class="im-list" id="messages">
      <li class="message-item item-myself" data-message-id="historic-1"><div class="text">历史消息，用于确定新增消息的起点。</div></li>
      <li class="message-item item-other" data-message-id="pk-card"><div class="text">BOSS 平台 PK 卡片占位</div></li>
    </ul>
  </div>
  <div class="chat-editor">
    <div id="chat-input" class="chat-input" contenteditable="true" role="textbox" aria-label="消息输入框"></div>
    <div class="send-message" id="image-send" role="button" aria-label="发送图片"><span>图片</span></div>
    <button class="send-message" id="text-send" type="button">发送</button>
  </div>
</div>
</html>
